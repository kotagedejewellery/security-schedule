name: security-schedule

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.security-schedule-http.entrypoints=web
      - traefik.http.routers.security-schedule-http.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env.production}`)
      - traefik.http.routers.security-schedule-http.middlewares=security-schedule-https
      - traefik.http.middlewares.security-schedule-https.redirectscheme.scheme=https
      - traefik.http.routers.security-schedule.entrypoints=websecure
      - traefik.http.routers.security-schedule.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env.production}`)
      - traefik.http.routers.security-schedule.tls=true
      - traefik.http.routers.security-schedule.tls.certresolver=letsencrypt
      - traefik.http.services.security-schedule.loadbalancer.server.port=80

  database:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

volumes:
  database-data:

networks:
  internal:
    internal: true
  proxy:
    external: true
